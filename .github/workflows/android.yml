name: Build Android TV app

# Builds a side-loadable APK. Push a tag like `tv-v3` (or run it by hand from
# the Actions tab) and the APK is attached to a GitHub Release / the run.
on:
  push:
    tags: ['tv-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "vyzn-tv-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vyzn-tv-apk
          path: android-tv/vyzn-tv-*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/vyzn-tv-*.apk
          generate_release_notes: true
