name: Publish container image

# Builds the server image (the Dockerfile at repo root) and pushes it to
# GitHub Container Registry whenever a version tag is pushed, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
# That's the whole "cut a release" step — docker-compose.yml on any
# deployed server (yours, or a friend's) then picks it up with
# `docker compose pull && docker compose up -d`, or by clicking
# "Check for Updates" in Control Center > Settings.
#
# Also builds (but does not push) on every push to main, as a build-health
# check — so a broken Dockerfile/build shows up before it's ever tagged.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag push (vX.Y.Z): build and push ghcr.io/<repo>:X.Y.Z and
      # :latest. On an ordinary push to main: build only, to catch a
      # broken Dockerfile early, without publishing an untagged image.
      - name: Derive image tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=vyzn:build-check" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
