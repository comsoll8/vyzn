services:
  vyzn:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time npm installs were timing out reaching registry.npmjs.org
      # on this host even with the Dockerfile's --dns-result-order=
      # ipv4first fix. network: host makes the build use the host's own
      # working network/DNS directly instead of Docker's internal build
      # network, sidestepping whatever's unreliable about the latter on
      # this host. This only affects the build step — the running
      # container's own network (ports, etc.) is unchanged below.
      #
      # IMPORTANT: confirmed on this host that BuildKit (Docker's default
      # builder) silently ignores this setting and uses its own internal
      # build network anyway, bringing the hang right back. You MUST build
      # with `DOCKER_BUILDKIT=0 docker compose up -d --build` (or just run
      # ./update.sh, which sets this for you) for network: host to
      # actually take effect. See the README's "Updating" section.
      network: host
    container_name: vyzn
    restart: unless-stopped
    ports:
      - "18080:8080"
    # Containers started via `docker compose` (rather than Unraid's own
    # "Add Container" template form) show up in the Docker tab with no
    # icon/WebUI button and no way to set them from the UI — clicking the
    # icon does nothing, since there's no backing XML template to edit.
    # Unraid's Docker page reads these two labels directly for exactly
    # that case: icon is the app's own favicon served over the mapped
    # port, webui uses Unraid's [IP]/[PORT:x] placeholders so the link
    # works regardless of which host IP/port this ends up bound to.
    labels:
      net.unraid.docker.icon: "http://[IP]:[PORT:8080]/assets/favicon-256.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
    environment:
      - PUID=99
      - PGID=100
      - TZ=Australia/Adelaide
      - MEDIA_DIR=/media
      - DATA_DIR=/config
      - TRANSCODE_DIR=/transcode
      - HW_TRANSCODE=true          # set false to fall back to CPU (libx264)
      - LIBVA_DRIVER_NAME=iHD      # use "i965" instead on pre-Broadwell Intel CPUs
      - SCAN_ONLY_DIRS=Movies,TvShows   # only these top-level folders under MEDIA_DIR are scanned
      - SCAN_TV_DIRS=TvShows            # which of the folders above are TV (not movies) — e.g. set to "tv" if your share uses a plain lowercase "tv" folder. Must list the SAME folder name(s) you used in SCAN_ONLY_DIRS, or everything in them gets misclassified as movies.
      - SCAN_PROBE_CONCURRENCY=4        # parallel ffprobe processes (CPU-bound; ~core count)
      - SCAN_TMDB_CONCURRENCY=15        # parallel TMDB lookups (network-bound; safe to raise for big libraries)
      # TMDB_API_KEY, TMDB_AUTH_TOKEN, SEERR_URL, SEERR_API_KEY, and
      # TAILSCALE_AUTHKEY can all be left unset here and entered instead
      # from Control Center > Settings once the app is running — handy for
      # a fresh install someone else will configure entirely through the
      # UI. Anything set here is just the starting default; a value saved
      # from Settings overrides it without needing a restart. See
      # src/config.js.
      - TMDB_API_KEY=              # <-- put your TMDB v3 API key here (short one, not the eyJ... token)
      # - TMDB_AUTH_TOKEN=         # <-- use this instead if you have the long eyJ... read access token
    volumes:
      - /mnt/user/appdata/vyzn:/config
      - /mnt/user/Media:/media:ro
      - /mnt/user/appdata/vyzn/transcode:/transcode
      # Optional: drop a show's theme song in here as {tmdb_id}.mp3 (e.g.
      # 1396.mp3 for Breaking Bad) and the Show Detail page plays it
      # automatically. Mounted as its own volume so files placed here
      # survive `docker compose up --build` — public/ itself is baked into
      # the image and would otherwise wipe out anything dropped straight
      # into the container.
      - /mnt/user/appdata/vyzn/theme-music:/app/public/theme-music
    devices:
      - /dev/dri:/dev/dri          # Intel QuickSync passthrough
      - /dev/net/tun:/dev/net/tun  # Tailscale — lets the container create its own VPN network interface
    cap_add:
      - NET_ADMIN                  # Tailscale — required alongside /dev/net/tun above
